<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daud Office · Kantor IT Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#070a12;--glass:rgba(17,24,39,.62);--line:rgba(148,163,184,.16);--cyan:#22d3ee;--violet:#a78bfa;--pink:#e879f9;--txt:#e2e8f0;--mute:#94a3b8}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;
    background-image:radial-gradient(900px 500px at 10% -10%,rgba(34,211,238,.13),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(167,139,250,.14),transparent 60%),
    linear-gradient(rgba(148,163,184,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.045) 1px,transparent 1px);
    background-size:auto,auto,28px 28px,28px 28px}
  header{width:100%;max-width:1320px;display:flex;justify-content:space-between;align-items:center;padding:22px 24px 16px;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .logo{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:'Press Start 2P',monospace;font-size:16px;color:#fff;
    background:linear-gradient(135deg,#0891b2,#7c3aed);box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 6px 24px rgba(124,58,237,.45)}
  h1{font-family:'Press Start 2P',monospace;font-size:22px;line-height:1.25;margin:0;letter-spacing:1px;
    background:linear-gradient(90deg,#67e8f9,#a78bfa 55%,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(34,211,238,.35))}
  .sub{font-size:13.5px;color:var(--mute);margin-top:7px;line-height:1.45}
  .sub b{color:#cbd5e1;font-weight:600}
  .hr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .live{display:flex;align-items:center;gap:8px;font:600 12px 'JetBrains Mono',monospace;color:#a7f3d0;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.35);padding:8px 12px;border-radius:999px;white-space:nowrap}
  .live i{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;animation:pulse 1.6s infinite}
  .live.off{color:#cbd5e1;background:rgba(148,163,184,.08);border-color:var(--line)}.live.off i{background:#94a3b8;box-shadow:none;animation:none}
  @keyframes pulse{50%{opacity:.35}}
  .clock{font:700 15px 'JetBrains Mono',monospace;background:var(--glass);border:1px solid var(--line);padding:9px 14px;border-radius:12px;color:#67e8f9;backdrop-filter:blur(10px);white-space:nowrap}
  .layout{width:100%;max-width:1320px;padding:0 24px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}
  #wrap{position:relative;isolation:isolate;width:100%;aspect-ratio:320/260;border-radius:16px;overflow:hidden;background:#0b0f17;
    box-shadow:0 0 0 1px rgba(34,211,238,.28),0 0 0 6px rgba(15,23,42,.9),0 0 0 7px rgba(167,139,250,.25),0 24px 60px rgba(0,0,0,.6),0 0 80px rgba(34,211,238,.08)}
  canvas{width:100%;height:100%;image-rendering:pixelated;display:block;cursor:pointer}
  #bubbles{position:absolute;inset:0;pointer-events:none}
  .bubble{position:absolute;transform:translate(-50%,-100%);width:max-content;text-align:center;background:rgba(248,250,252,.96);color:#0f172a;
    font-size:var(--fs,12px);line-height:1.22;font-weight:600;padding:.38em .62em;border-radius:.6em;border:1px solid rgba(34,211,238,.55);
    box-shadow:0 3px 10px rgba(0,0,0,.35),0 0 0 2px rgba(15,23,42,.35)}
  .bubble span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,3);overflow:hidden;overflow-wrap:anywhere}
  .bubble:after{content:'';position:absolute;left:calc(50% + var(--tx,0px));bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-bottom:0;border-top-color:rgba(248,250,252,.96)}
  .bubble.coffee{max-width:none!important;white-space:nowrap;background:#fff7ed;border-color:#f59e0b;color:#7c2d12}.bubble.coffee:after{border-top-color:#fff7ed}.bubble.coffee span{display:block}
  .tag{position:absolute;transform:translate(-50%,0);font-family:'Press Start 2P',monospace;font-size:var(--tfs,8px);background:rgba(15,23,42,.88);color:#e0f2fe;padding:.4em .55em;border-radius:4px;white-space:nowrap;border-left:2px solid var(--c,#22d3ee)}
  .tag.empty{background:rgba(51,65,85,.75);color:#94a3b8;border-left-color:#64748b}
  .panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .ph{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 12px}
  .ph h3{margin:0;font:700 12px 'Press Start 2P',monospace;color:#e2e8f0;letter-spacing:.5px}
  .ph span{font:600 12px 'JetBrains Mono',monospace;color:var(--mute)}
  #team{display:flex;flex-direction:column;gap:8px}
  .m{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;border:1px solid transparent;background:rgba(30,41,59,.45);transition:.15s}
  .m:hover,.m:focus-visible{border-color:rgba(34,211,238,.45);background:rgba(30,41,59,.8)}
  .av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 11px 'Press Start 2P',monospace;color:#fff;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.08) inset,0 4px 12px color-mix(in srgb,var(--c) 45%,transparent)}
  .info{min-width:0}
  .info b{display:block;font-size:13.5px;font-weight:700;color:#f1f5f9}
  .info small{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info em{display:block;font:500 11.5px/1.35 'JetBrains Mono',monospace;font-style:normal;color:#a5f3fc;margin-top:3px;overflow-wrap:anywhere}
  .chip{font:600 10px 'JetBrains Mono',monospace;padding:4px 7px;border-radius:999px;white-space:nowrap;color:#6ee7b7;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3)}
  .chip.away{color:#fcd34d;background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.35)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:14px 4px 2px;font-size:11.5px;color:var(--mute)}
  .legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
  #card{position:fixed;inset:0;background:rgba(2,6,23,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  #card .box{background:rgba(15,23,42,.92);border:1px solid rgba(34,211,238,.35);border-radius:18px;padding:22px;width:min(92vw,430px);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(34,211,238,.12)}
  #card h2{font-family:'Press Start 2P',monospace;font-size:15px;color:#67e8f9;margin:0 0 10px;line-height:1.4}
  #card .role{color:#c4b5fd;font-weight:700;margin-bottom:10px;font-size:14px}
  #card p{margin:6px 0 16px;color:#cbd5e1;line-height:1.5}
  #card label{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  #card input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(148,163,184,.3);background:#0b1220;color:#fff;font-family:'JetBrains Mono',monospace;font-size:14px;margin:7px 0 16px;outline:none}
  #card input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.2)}
  .btns{display:flex;gap:10px;justify-content:flex-end}
  button.b{font-family:'Press Start 2P',monospace;font-size:10px;padding:11px 14px;border:none;border-radius:10px;cursor:pointer}
  .save{background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#0f172a}.close{background:#1e293b;color:#e2e8f0;border:1px solid var(--line)!important}
  footer{font-size:12.5px;color:#64748b;padding:22px 16px 26px;text-align:center;line-height:1.6}
  footer b{color:#94a3b8}
  @media (max-width:1020px){.layout{grid-template-columns:1fr}.panel #team{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}}
  @media (max-width:560px){header{padding:16px 12px 12px}.layout{padding:0 10px;gap:14px}h1{font-size:16px}.logo{width:38px;height:38px;font-size:13px}.sub{font-size:12.5px}
    #wrap{border-radius:10px}.clock{font-size:13px;padding:7px 10px}.live{padding:6px 10px;font-size:11px}.panel{padding:12px}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">D</div><div><h1>DAUD OFFICE</h1><div class="sub">Kantor IT modern · tim AI Daud — <b>klik karakter</b> untuk lihat detail &amp; ubah statusnya</div></div></div>
  <div class="hr"><span class="live off" id="sync"><i></i><span id="syncT">LOKAL</span></span><div class="clock" id="clock">--:--:-- WIB</div></div>
</header>
<main class="layout">
  <div id="wrap"><canvas id="c" width="320" height="260"></canvas><div id="bubbles"></div></div>
  <aside class="panel">
    <div class="ph"><h3>TIM DAUD</h3><span id="teamCount"></span></div>
    <div id="team"></div>
    <div class="legend"><span><i style="background:#34d399"></i>Kerja</span><span><i style="background:#f59e0b"></i>Rehat kopi</span><span><i style="background:#22d3ee"></i>Status live dari server</span></div>
  </aside>
</main>
<footer><b>Daud Office</b> · status karyawan diperbarui otomatis.<br>Tambah karyawan AI baru: edit daftar <b>AGENTS</b> di bagian atas skrip file ini.</footer>
<div id="card"><div class="box">
  <h2 id="cName"></h2><div class="role" id="cRole"></div><p id="cDesc"></p>
  <label for="cStatus">Status sekarang</label><input id="cStatus" maxlength="60">
  <div class="btns"><button class="b close" id="cClose">TUTUP</button><button class="b save" id="cSave">SIMPAN</button></div>
</div></div>
<script>
// ====== DAFTAR KARYAWAN AI (edit di sini) ======
const AGENTS = [
  {id:'grok', name:'Grok Bot', role:'Asisten Utama · IT Service Management', status:'Lagi desain poster The Way Home', desc:'Bantu desain, riset, coding, dan urusan Slack & Canva.', shirt:'#7a1e2c', hair:'#3a2a1a', skin:'#f1c27d', desk:0},
  {id:'new', name:'New Bot', role:'Asisten Baru', status:'Menunggu tugas pertama', desc:'Karyawan baru yang siap dikasih kerjaan.', shirt:'#4a7fbf', hair:'#1a1a2a', skin:'#e0ac69', desk:1},
  {id:'mukti', name:'Mukti', role:'Bot Baru', status:'Halo, saya Mukti! Baru gabung', desc:'Karyawan AI paling baru di kantor.', shirt:'#3f8f4f', hair:'#5a3a1a', skin:'#d9a066', desk:2},
  {id:'dira', name:'Dira', role:'Desainer', status:'Siap, menunggu tugas', desc:'Poster, feed/story IG, slide, dan aset Canva.', shirt:'#c0567a', hair:'#2a1a12', skin:'#f1c27d', desk:3},
  {id:'kata', name:'Kata', role:'Penulis Konten', status:'Siap, menunggu tugas', desc:'Caption, pengumuman, teks poster, dan draf pesan.', shirt:'#e0a526', hair:'#1a1a1a', skin:'#e0ac69', desk:4},
  {id:'riko', name:'Riko', role:'Riset', status:'Siap, menunggu tugas', desc:'Cari info, bandingkan pilihan, dan cek fakta.', shirt:'#2f6f8f', hair:'#3a2a1a', skin:'#c68642', desk:5},
  {id:'sari', name:'Sari', role:'Admin & Jadwal', status:'Siap, menunggu tugas', desc:'Rundown acara, to-do list, notulen, dan pengingat.', shirt:'#8a5ac0', hair:'#4a2a1a', skin:'#f1c27d', desk:6},
  {id:'tegar', name:'Tegar', role:'IT Support', status:'Siap, menunggu tugas', desc:'Bantu masalah komputer, aplikasi, akun, dan spreadsheet.', shirt:'#4f4f5f', hair:'#111', skin:'#d9a066', desk:7},
];
// ===============================================
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=320,H=260;
// 9 meja (3x3). Meja yang tidak dipakai agent tampil sebagai "Kursi kosong".
const DESKS=[{x:22,y:108},{x:90,y:108},{x:158,y:108},{x:22,y:168},{x:90,y:168},{x:158,y:168},{x:22,y:228},{x:90,y:228},{x:158,y:228}];
const COFFEE={x:268,y:184};
const saved=JSON.parse(localStorage.getItem('kv-status')||'{}');
AGENTS.forEach(a=>{if(saved[a.id])a.status=saved[a.id];const d=DESKS[a.desk];a.home={x:d.x+14,y:d.y-9};a.x=a.home.x;a.y=a.home.y;a.mode='work';a.t=Math.random()*400;a.next=600+Math.random()*900});
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function hourWIB(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Jakarta'})).getHours()}
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)}

// ---- font piksel 3x5 untuk tulisan di dalam kanvas ----
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',W:'101101111111101',Y:'101101010010010',
  '0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','/':'001001010100100',':':'000010000010000','-':'000000111000000','.':'000000000000010',' ':'000000000000000'};
function txt(s,x,y,c,sc=1,hi){[...s].forEach((ch,i)=>{const p=FONT[ch]||FONT[' '];for(let k=0;k<15;k++)if(p[k]==='1'){const px=x+(i*4+k%3)*sc,py=y+Math.floor(k/3)*sc;R(px,py,sc,sc,c);if(hi&&sc>1)R(px,py,1,1,hi)}})}

// ---- latar: dinding, jendela kota, lantai ----
function skyline(x,y,w,h,f){
  const hr=hourWIB(),night=hr<6||hr>=18,dusk=!night&&(hr<8||hr>=16);
  const sky=night?['#070b1f','#0e1533','#18204a']:dusk?['#3b2f6b','#b65a7a','#f0a35e']:['#4f9be0','#7db8ee','#b3d9f7'];
  const b=Math.ceil(h/3);sky.forEach((c,i)=>R(x,y+i*b,w,Math.min(b,h-i*b),c));
  if(night){for(let i=0;i<14;i++){const sx=x+hash(i+x)*w,sy=y+hash(i*3+x)*h*.45;R(sx,sy,1,1,(f/20+i)%7<1?'#64748b':'#e2e8f0')}R(x+w-16,y+4,5,5,'#fef3c7');R(x+w-15,y+5,2,2,'#fde68a')}
  else{const cx=x+((f/14+x*3)%(w+30))-20;R(cx,y+6,14,3,'rgba(255,255,255,.85)');R(cx+3,y+4,7,2,'rgba(255,255,255,.85)');R(Math.max(x,cx-40),y+14,10,2,'rgba(255,255,255,.6)')}
  // gedung belakang
  let bx=x;let i=0;while(bx<x+w){const bw=6+Math.floor(hash(i+x*.1)*8),bh=10+Math.floor(hash(i*7+x)*16);R(bx,y+h-bh,Math.min(bw,x+w-bx),bh,night?'#141b33':dusk?'#4a3a6a':'#8aa7c8');bx+=bw;i++}
  // gedung depan
  bx=x-3;i=0;while(bx<x+w){const bw=8+Math.floor(hash(i*5+x+1)*9),bh=8+Math.floor(hash(i*11+x+2)*22),ww=Math.min(bw,x+w-bx),sx=Math.max(bx,x),vw=ww-(sx-bx);
    if(vw>0){R(sx,y+h-bh,vw,bh,night?'#0a0f1e':dusk?'#2a2342':'#56708f');
      for(let wy=y+h-bh+2;wy<y+h-1;wy+=3)for(let wx=bx+1;wx<bx+ww-1;wx+=2){if(wx<x)continue;const on=hash(wx*13+wy*7);
        R(wx,wy,1,1,night?(on>.55?(on>.97&&(f>>5)%2?'#0a0f1e':'#fcd34d'):'#111827'):dusk?(on>.7?'#fbbf24':'#3b3358'):(on>.5?'#9cc3e6':'#4a6380'))}
      if(hash(i+x)>.6)R(sx+Math.floor(vw/2),y+h-bh-3,1,3,night?'#334155':'#475569');}
    bx+=bw+1;i++}
  return night;
}
function windowFrame(x,y,w,h){
  R(x-2,y-2,w+4,2,'#0a0d14');R(x-2,y+h,w+4,2,'#0a0d14');R(x-2,y,2,h,'#0a0d14');R(x+w,y,2,h,'#0a0d14');
  for(let mx=x+26;mx<x+w-4;mx+=26)R(mx,y,1,h,'#0a0d14');
  for(let k=0;k<3;k++){g.fillStyle='rgba(255,255,255,.06)';for(let j=0;j<8;j++)g.fillRect(x+8+k*30+j,y+h-8-j*2,2,2)}
  R(x-3,y+h+2,w+6,2,'#334155');R(x-3,y+h+4,w+6,1,'#0f172a');
}
function plant(x,y){
  R(x-1,y+9,12,2,'rgba(0,0,0,.3)');
  R(x+4,y-6,1,7,'#14532d');R(x+6,y-8,1,9,'#14532d');
  R(x-2,y-9,7,5,'#166534');R(x-3,y-7,3,2,'#15803d');R(x+5,y-13,7,6,'#15803d');R(x+10,y-10,3,3,'#16a34a');R(x,y-15,6,5,'#16a34a');R(x+1,y-14,2,1,'#4ade80');R(x+6,y-12,2,1,'#4ade80');R(x-1,y-8,2,1,'#4ade80');R(x+2,y-4,6,4,'#166534');
  R(x,y,10,9,'#e2e8f0');R(x-1,y,12,2,'#f8fafc');R(x+7,y+2,3,7,'#cbd5e1');R(x,y+8,10,1,'#94a3b8');
}
function bg(f){
  // dinding
  R(0,0,W,64,'#161c2a');for(let x=0;x<W;x+=20)R(x,2,1,58,'#1b2233');
  R(0,58,W,3,'#0d111a');
  // jendela + skyline
  const night=skyline(32,8,78,42,f);windowFrame(32,8,78,42);
  skyline(210,8,104,42,f);windowFrame(210,8,104,42);
  // rak server
  R(4,62,24,4,'rgba(0,0,0,.35)');R(6,10,20,55,'#0b0f17');R(6,10,20,1,'#475569');R(6,10,1,55,'#334155');R(25,10,1,55,'#1e293b');
  for(let u=0;u<8;u++){const uy=14+u*6;R(8,uy,16,5,'#151b27');R(8,uy,16,1,'#222b3c');for(let v=0;v<5;v++)R(16+v*2,uy+2,1,2,'#0b0f17')}
  R(8,62,16,2,'#151b27');
  // panel logo + layar dashboard (rangka)
  R(112,4,96,15,'#0f1420');R(112,18,96,1,'#0a0d14');
  R(123,22,74,33,'#05070c');R(124,23,72,31,'#1f2937');R(125,24,70,29,'#07101f');R(158,55,4,3,'#334155');
  // lantai
  for(let y=64;y<H;y+=12)for(let x=0;x<W;x+=24){const o=((y-64)/12)%2?12:0;R(x-o,y,24,12,((x/24+(y-64)/12)%2)?'#1c2230':'#1a202d');R(x-o,y,24,1,'#232b3c');R(x-o,y,1,12,'#202839')}
  R(0,64,W,3,'rgba(34,211,238,.10)');R(0,67,W,2,'rgba(34,211,238,.05)');
  // karpet area kerja
  R(14,80,204,176,'#1d2536');R(14,80,204,1,'#2c3850');R(14,255,204,1,'#2c3850');R(14,80,1,176,'#2c3850');R(217,80,1,176,'#2c3850');
  for(let y=84;y<254;y+=4)R(16,y,200,1,'rgba(255,255,255,.012)');
  // ruang rapat (kaca)
  R(224,61,96,79,'#16232e');for(let y=64;y<138;y+=6)R(224,y,96,1,'rgba(255,255,255,.02)');
  R(240,108,64,3,'rgba(0,0,0,.35)');

function update(a){
  a.next--;
  if(a.mode==='work'&&a.next<0){if(AGENTS.some(b=>b!==a&&b.mode!=='work'))a.next=120+Math.random()*300;else{a.mode='go';a.target={x:COFFEE.x-10+Math.random()*20,y:COFFEE.y+4}}}
  if(a.mode==='go'||a.mode==='back'){const t=a.mode==='go'?a.target:a.home;const dx=t.x-a.x,dy=t.y-a.y,d=Math.hypot(dx,dy);
    if(d<1){if(a.mode==='go'){a.mode='coffee';a.wait=180}else{a.x=a.home.x;a.y=a.home.y;a.mode='work';a.next=900+Math.random()*1200}}else{a.x+=dx/d*.6;a.y+=dy/d*.6}}
  if(a.mode==='coffee'){if(--a.wait<0)a.mode='back'}
}
